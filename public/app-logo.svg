<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background circle -->
  <rect width="192" height="192" fill="#0f5238" rx="45"/>

  <!-- Town/buildings icon -->
  <g fill="white" transform="translate(48, 50) scale(2)">
    <!-- Building 1 -->
    <rect x="0" y="12" width="12" height="24" fill="white"/>
    <rect x="2" y="14" width="2" height="2" fill="#0f5238"/>
    <rect x="6" y="14" width="2" height="2" fill="#0f5238"/>
    <rect x="2" y="18" width="2" height="2" fill="#0f5238"/>
    <rect x="6" y="18" width="2" height="2" fill="#0f5238"/>
    <rect x="2" y="22" width="2" height="2" fill="#0f5238"/>
    <rect x="6" y="22" width="2" height="2" fill="#0f5238"/>

    <!-- Building 2 -->
    <rect x="14" y="16" width="10" height="20" fill="white"/>
    <rect x="16" y="18" width="2" height="2" fill="#0f5238"/>
    <rect x="20" y="18" width="2" height="2" fill="#0f5238"/>
    <rect x="16" y="22" width="2" height="2" fill="#0f5238"/>
    <rect x="20" y="22" width="2" height="2" fill="#0f5238"/>

    <!-- Building 3 -->
    <rect x="26" y="14" width="10" height="22" fill="white"/>
    <rect x="28" y="16" width="2" height="2" fill="#0f5238"/>
    <rect x="32" y="16" width="2" height="2" fill="#0f5238"/>
    <rect x="28" y="20" width="2" height="2" fill="#0f5238"/>
    <rect x="32" y="20" width="2" height="2" fill="#0f5238"/>
  </g>
</svg>
