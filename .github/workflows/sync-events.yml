name: Sync Events Daily

on:
  schedule:
    # 07:00 UTC = 09:00 hora peninsular (08:00 en invierno). GitHub puede
    # retrasar el disparo unos minutos en horas de carga.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-events cron
        run: |
          curl --fail-with-body -X POST https://ennavalcarnero.es/api/sync-events \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
